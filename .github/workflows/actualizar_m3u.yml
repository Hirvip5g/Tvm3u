name: Actualizar M3U Automaticamente

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write  # <--- IMPORTANTE: Con esto le das permiso de escritura al workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install httpx

      - name: Ejecutar script generador
        run: python generar_m3u.py

      - name: Guardar cambios en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add eventos_streamxhd.m3u
          git commit -m "Actualización automática de lista M3U [skip ci]" || exit 0
          git push

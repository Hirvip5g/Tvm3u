name: Actualizar catálogo de XuperTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js y Python
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener catálogo de XuperTV
        run: python obtener_canales_xuper.py

      - name: Guardar JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canales_xuper.json
          git diff --cached --quiet || git commit -m "Actualizar catálogo de canales XuperTV"
          git push

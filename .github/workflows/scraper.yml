name: Ejecutar Scraper Competencia Deportiva

on:
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:
  
  # Opcional: Puedes programar que se ejecute automáticamente cada cierto tiempo (ej. cada 6 horas)
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de extracción
        run: python script.py

      # Opcional: Si quieres que el archivo HTML generado se guarde o se suba como artefacto
      - name: Subir archivo HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: evento-html
          path: evento.html
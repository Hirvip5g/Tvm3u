name: Actualizar Agenda Manual

on:
  workflow_dispatch: # Se ejecuta únicamente cuando lo hagas de forma manual desde GitHub

permissions:
  contents: write

jobs:
  update-agenda-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Procesar Agenda Manual
        env:
          AGENDA_URL: ${{ secrets.AGENDA_URL }}
        run: python procesar_eventos_m3u.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda manual actualizada" || exit 0
          
          # Actualiza el repositorio local trayendo los cambios remotos y aplicando los tuyos encima
          git pull --rebase origin main
          
          # Envía los cambios a la rama main de forma explícita
          git push origin main
